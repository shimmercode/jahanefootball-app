<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>جهان فوتبال</title>
  <style>
    @font-face { font-family: "Yekan Bakh"; src: url("fonts/YekanBakh-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Yekan Bakh"; src: url("fonts/YekanBakh-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Yekan Bakh"; src: url("fonts/YekanBakh-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

    :root, html[data-theme="light"] {
      --bg: #f3f5f8;
      --bg2: #ffffff;
      --header: #0e1116;
      --card: #ffffff;
      --text: #12141a;
      --muted: #6b7280;
      --line: #e7e9ee;
      --accent: #e10600;
      --accent2: #ff4d2e;
      --shadow: 0 10px 30px rgba(16,24,40,.08);
      --nav: #ffffff;
      --chip: #fff1f0;
    }
    html[data-theme="dark"] {
      --bg: #07090d;
      --bg2: #10141c;
      --header: #07090d;
      --card: #141922;
      --text: #f4f6fb;
      --muted: #93a0b5;
      --line: #232a36;
      --accent: #ff3b30;
      --accent2: #ff6b4a;
      --shadow: 0 12px 32px rgba(0,0,0,.35);
      --nav: #0d1118;
      --chip: #2a1214;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Yekan Bakh", Tahoma, sans-serif; }
    body { min-height: 100vh; }
    img { max-width: 100%; display: block; object-fit: cover; }
    button, input { font-family: inherit; }
    #app { max-width: 760px; margin: 0 auto; min-height: 100vh; padding-bottom: 92px; }
    .splash {
      position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0e1116; transition: .4s;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .splash img { width: 132px; height: 132px; object-fit: contain; background: #fff; border-radius: 32px; padding: 10px; }
    .splash h1 { color: #fff; margin: 18px 0 4px; font-size: 24px; font-weight: 700; }
    .splash p { color: #9aa3b2; margin: 0; }

    header.bar {
      position: sticky; top: 0; z-index: 20; background: var(--header);
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    }
    header.bar .brand { height: 38px; width: auto; background: #fff; border-radius: 10px; padding: 4px 8px; object-fit: contain; }
    header.bar h1 { flex: 1; color: #fff; font-size: 16px; margin: 0; font-weight: 700; }
    .ibtn {
      width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(255,255,255,.1);
      color: #fff; display: grid; place-items: center;
    }
    .ibtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .hero-track {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      gap: 12px; padding: 14px 14px 8px; scrollbar-width: none; direction: ltr;
    }
    .hero .cap { direction: rtl; text-align: right; }
    .hero-track::-webkit-scrollbar { display: none; }
    .hero {
      min-width: 86%; scroll-snap-align: center; height: 228px; border-radius: 22px;
      overflow: hidden; position: relative; box-shadow: var(--shadow); background: #222;
    }
    .hero img { width: 100%; height: 100%; }
    .hero .cap {
      position: absolute; inset: auto 0 0 0; padding: 18px 16px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,.86)); color: #fff;
    }
    .hero h3 { margin: 8px 0 0; font-size: 18px; line-height: 1.45; font-weight: 700; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; background: var(--accent);
      color: #fff; border-radius: 8px; padding: 3px 8px; font-size: 11px; font-weight: 700;
    }
    .dots { display: flex; justify-content: center; gap: 6px; padding: 2px 0 6px; }
    .dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--line); display: block; }
    .dots i.on { width: 18px; background: var(--accent); }

    .cats { display: flex; gap: 8px; overflow: auto; padding: 6px 14px 10px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cats button {
      border: 0; background: var(--card); color: var(--text); padding: 8px 14px;
      border-radius: 999px; font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow);
      white-space: nowrap;
    }
    .cats button.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }

    .sec { padding: 4px 14px 0; }
    .sec h2 { font-size: 16px; margin: 12px 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .sec h2:before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }

    .card, .hero, .cats button, nav.tab button { cursor: pointer; }
    .card {
      display: flex; gap: 0; background: var(--card); border-radius: 18px; overflow: hidden;
      margin-bottom: 12px; box-shadow: var(--shadow);
    }
    .card img { width: 124px; height: 108px; flex-shrink: 0; background: var(--bg2); }
    .card .body { padding: 11px 12px; min-width: 0; }
    .card .cat { color: var(--accent); font-size: 11px; font-weight: 700; }
    .card h3 { margin: 5px 0 8px; font-size: 14px; line-height: 1.55; font-weight: 700; }
    .card time { color: var(--muted); font-size: 11px; }

    .sk { height: 14px; border-radius: 8px; background: linear-gradient(90deg, var(--line), var(--card), var(--line)); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
    .sk-hero { height: 220px; margin: 14px; border-radius: 22px; }

    nav.tab {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 760px; margin: 0 auto;
      background: var(--nav); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.06);
    }
    nav.tab button { border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600; }
    nav.tab button.active { color: var(--accent); }
    nav.tab svg { width: 22px; height: 22px; display: block; margin: 0 auto 3px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    nav.tab button.active svg { fill: color-mix(in srgb, var(--accent) 16%, transparent); }

    .searchbox { margin: 12px 14px; display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
    .searchbox input { flex: 1; border: 0; outline: 0; background: none; color: var(--text); font-size: 14px; }
    .article .cover { width: 100%; height: 250px; background: #222; }
    .article .pad { padding: 18px 16px 40px; }
    .article h2 { font-size: 23px; line-height: 1.55; margin: 10px 0 8px; font-weight: 700; }
    .article .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
    .article .content { line-height: 2.05; font-size: 16px; }
    .article .content img, .article .content video { border-radius: 14px; margin: 12px 0; width: 100%; height: auto; }
    .article .content p { margin: 0 0 12px; }
    .article .content iframe { max-width: 100%; }
    .empty { text-align: center; color: var(--muted); padding: 48px 20px; line-height: 1.9; }
    .panel { margin: 14px; padding: 16px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .switch { width: 48px; height: 28px; border-radius: 99px; background: #c5c9d1; position: relative; border: 0; }
    .switch.on { background: var(--accent); }
    .switch i { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch.on i { right: 23px; }
    .status { text-align: center; color: var(--muted); font-size: 12px; padding: 8px; }
    .modal {
      position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .modal .box {
      width: min(360px, 100%); background: var(--card); color: var(--text);
      border-radius: 22px; padding: 22px 18px 16px; box-shadow: var(--shadow); text-align: center;
    }
    .modal h3 { margin: 0 0 8px; font-size: 18px; }
    .modal p { margin: 0 0 18px; color: var(--muted); line-height: 1.8; }
    .modal .actions { display: flex; gap: 8px; }
    .modal .actions button {
      flex: 1; border: 0; border-radius: 14px; padding: 12px 8px; font-weight: 700; font-size: 14px;
    }
    .btn-stay { background: var(--bg); color: var(--text); }
    .btn-leave { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <img alt="جهان فوتبال" src="logo.png" />
    <h1>جهان فوتبال</h1>
    <p>جدیدترین اخبار دنیای فوتبال</p>
  </div>
  <div id="app"></div>
  <nav class="tab" id="tab">
    <button data-route="home" class="active"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>خانه</button>
    <button data-route="news"><svg viewBox="0 0 24 24"><path d="M5 5h10v14H5z"/><path d="M15 8h4v11h-4"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3.5"/></svg>اخبار</button>
    <button data-route="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>جستجو</button>
    <button data-route="football"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M7 5.5c2 2.2 8 2.2 10 0M7 18.5c2-2.2 8-2.2 10 0"/></svg>مسابقات</button>
    <button data-route="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>بیشتر</button>
  </nav>
  <script>
    const WP = "https://jahanefootball.com";
    const LOGO = "logo.png";
    const I = {
      back: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
      sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: '<svg viewBox="0 0 24 24"><path d="M16 3a8 8 0 1 0 5 13 7 7 0 0 1-5-13z"/></svg>'
    };
    const state = {
      route: "home",
      category: "all",
      query: "",
      posts: [],
      categories: [{ id: "all", name: "همه" }],
      loading: true,
      error: "",
      theme: localStorage.getItem("jf-theme") || "light"
    };

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", state.theme === "dark" ? "#07090d" : "#0e1116");
      localStorage.setItem("jf-theme", state.theme);
    }
    applyTheme();

    function strip(html) {
      const d = document.createElement("div");
      d.innerHTML = html || "";
      return (d.textContent || "").replace(/\s+/g, " ").trim();
    }
    function decode(s) {
      const d = document.createElement("textarea");
      d.innerHTML = s || "";
      return d.value;
    }
    function imgOf(post) {
      try { return post._embedded["wp:featuredmedia"][0].source_url || ""; } catch (e) { return ""; }
    }
    function catOf(post) {
      try {
        for (const g of (post._embedded["wp:term"] || [])) {
          for (const t of g) if (t.taxonomy === "category") return { id: String(t.id), name: t.name };
        }
      } catch (e) {}
      const id = post.categories && post.categories[0];
      const found = state.categories.find(c => c.id === String(id));
      return { id: id ? String(id) : "all", name: found ? found.name : "اخبار" };
    }
    function mapPost(p) {
      const c = catOf(p);
      return {
        id: String(p.id),
        title: decode(strip(p.title && p.title.rendered)),
        excerpt: decode(strip(p.excerpt && p.excerpt.rendered)),
        content: (p.content && p.content.rendered) || "",
        image: imgOf(p),
        category: c.name,
        category_id: c.id,
        category_ids: (p.categories || []).map(String),
        date: p.date,
        link: p.link
      };
    }
    function faDate(iso) {
      try { return new Date(iso).toLocaleDateString("fa-IR", { year: "numeric", month: "long", day: "numeric" }); }
      catch (e) { return ""; }
    }
    async function wp(path) {
      const r = await fetch(WP + path, { headers: { Accept: "application/json" } });
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }

    function filtered() {
      if (state.category === "all") return state.posts;
      return state.posts.filter(p => (p.category_ids || [p.category_id]).indexOf(state.category) !== -1);
    }

    async function boot() {
      render();
      try {
        const [posts, cats] = await Promise.all([
          wp("/wp-json/wp/v2/posts?per_page=50&_embed=1"),
          wp("/wp-json/wp/v2/categories?per_page=50&hide_empty=true")
        ]);
        state.categories = [{ id: "all", name: "همه" }].concat(
          (cats || []).filter(c => c.slug !== "uncategorized").map(c => ({ id: String(c.id), name: c.name }))
        );
        state.posts = (posts || []).map(mapPost);
        state.error = state.posts.length ? "" : "خبری از سایت نیامد.";
      } catch (e) {
        state.error = "اتصال به سایت برقرار نشد.";
      }
      state.loading = false;
      render();
      bindHero();
    }

    async function loadFull(id) {
      let post = state.posts.find(p => p.id === id);
      try {
        const raw = await wp("/wp-json/wp/v2/posts/" + id + "?_embed=1");
        post = mapPost(raw);
        const i = state.posts.findIndex(p => p.id === id);
        if (i >= 0) state.posts[i] = post; else state.posts.unshift(post);
      } catch (e) {}
      if (post && (!post.content || strip(post.content).length < 40) && post.link) {
        try {
          const html = await fetch(post.link).then(r => r.text());
          const doc = new DOMParser().parseFromString(html, "text/html");
          const node = doc.querySelector(".entry-content, .wd-entry-content, article .post-content, .elementor-widget-theme-post-content, article");
          if (node) post.content = node.innerHTML;
        } catch (e) {}
      }
      return post;
    }

    function header(title, extra) {
      return `<header class="bar">
        <img class="brand" src="${LOGO}" alt="جهان فوتبال" />
        <h1>${title}</h1>
        ${extra || ""}
      </header>`;
    }
    function card(n) {
      return `<article class="card" data-open="${n.id}">
        <img src="${n.image || LOGO}" alt="" onerror="this.src='${LOGO}'" />
        <div class="body"><div class="cat">${n.category}</div><h3>${n.title}</h3><time>${faDate(n.date)}</time></div>
      </article>`;
    }
    function skeletons() {
      return `<div class="sk sk-hero"></div><div class="sec">${[1,2,3].map(()=>`<div class="card"><div style="width:124px;height:108px" class="sk"></div><div class="body"><div class="sk" style="width:40%"></div><div class="sk" style="margin-top:10px"></div><div class="sk" style="width:70%;margin-top:8px"></div></div></div>`).join("")}</div>`;
    }

    function render() {
      const app = document.getElementById("app");
      const list = filtered();
      const featured = state.posts.slice(0, 5);
      if (state.route === "home") {
        app.innerHTML = `${header("جهان فوتبال")}
          ${state.error ? `<div class="status">${state.error}</div>` : ""}
          ${state.loading ? skeletons() : `
          <div class="hero-track" id="heroTrack">
            ${featured.map(n => `<div class="hero" data-open="${n.id}">
              <img src="${n.image || LOGO}" onerror="this.src='${LOGO}'" />
              <div class="cap"><span class="badge">${n.category}</span><h3>${n.title}</h3></div>
            </div>`).join("")}
          </div>
          <div class="dots" id="dots">${featured.map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div>
          <div class="cats">${state.categories.map(c => `<button class="${c.id===state.category?"on":""}" data-cat="${c.id}">${c.name}</button>`).join("")}</div>
          <div class="sec"><h2>آخرین اخبار</h2>${list.map(card).join("") || '<div class="empty">خبری نیست.</div>'}</div>`}`;
        bindHero();
      } else if (state.route === "news") {
        app.innerHTML = `${header("اخبار")}
          <div class="cats">${state.categories.map(c => `<button class="${c.id===state.category?"on":""}" data-cat="${c.id}">${c.name}</button>`).join("")}</div>
          <div class="sec">${list.map(card).join("") || '<div class="empty">خبری در این دسته نیست.</div>'}</div>`;
      } else if (state.route === "search") {
        app.innerHTML = `${header("جستجو")}<div class="searchbox"><input id="q" placeholder="جستجو در اخبار جهان فوتبال…" value="${state.query}" /><span>⌕</span></div>
          <div class="sec" id="results">${searchItems().map(card).join("")}</div>`;
        const q = document.getElementById("q");
        if (q) q.oninput = () => { state.query = q.value; const box = document.getElementById("results"); if (box) box.innerHTML = searchItems().map(card).join("") || '<div class="empty">نتیجه‌ای پیدا نشد.</div>'; };
      } else if (state.route === "football") {
        app.innerHTML = `${header("مسابقات")}<div class="panel">نتایج زنده از افزونه اختصاصی سایت در مرحله بعد وصل می‌شود.</div>
          <div class="sec"><div class="card" onclick="location.href='${WP}/%d8%ac%d8%af%d9%88%d9%84-%d9%84%db%8c%da%af-%d8%b1%d9%82%d8%a7%d8%a8%d8%aa-%d9%87%d8%a7/'"><div class="body"><div class="cat">سایت</div><h3>مشاهده جدول رقابت‌ها</h3><time>jahanefootball.com</time></div></div></div>`;
      } else if (state.route === "more") {
        app.innerHTML = `${header("تنظیمات")}
          <div class="panel" style="text-align:center">
            <img src="${LOGO}" alt="" style="width:92px;height:92px;margin:0 auto 10px;border-radius:22px;background:#fff;padding:6px" />
            <div style="font-weight:700;font-size:18px">جهان فوتبال</div>
            <div class="status">منبع زنده: jahanefootball.com</div>
          </div>
          <div class="panel">
            <div class="row"><div>حالت تیره</div><button id="themeBtn" class="switch ${state.theme==="dark"?"on":""}"><i></i></button></div>
          </div>`;
        const b = document.getElementById("themeBtn");
        if (b) b.onclick = () => { state.theme = state.theme === "dark" ? "light" : "dark"; applyTheme(); render(); };
      } else if (state.route.startsWith("article:")) {
        const id = state.route.slice(8);
        const n = state.posts.find(p => p.id === id) || { title: "در حال بارگذاری…", content: "", image: "", category: "", date: "" };
        app.innerHTML = `<article class="article">
          <header class="bar"><button class="ibtn" type="button" data-back="1">${I.back}</button><h1>خبر</h1></header>
          <img class="cover" src="${n.image || LOGO}" onerror="this.src='${LOGO}'" />
          <div class="pad"><span class="badge">${n.category || "اخبار"}</span>
            <h2>${n.title || ""}</h2>
            <div class="meta">${faDate(n.date)}</div>
            <div class="content" id="fullContent">${n.content || n.excerpt || "در حال دریافت متن کامل…"}</div>
          </div></article>`;
      }
      document.querySelectorAll("#tab button").forEach(b => {
        b.classList.toggle("active", b.dataset.route === state.route || (state.route.startsWith("article") && b.dataset.route === "news"));
      });
    }

    function searchItems() {
      const q = state.query.trim();
      if (!q) return state.posts;
      return state.posts.filter(p => (p.title + p.excerpt + p.category).indexOf(q) !== -1);
    }
    function go(route) {
      if (!route) return;
      if (route === state.route) {
        render();
        return;
      }
      try { history.pushState({ r: state.route }, ""); } catch (e) {}
      state.route = route;
      render();
    }
    function pickCat(id) {
      state.category = String(id);
      if (state.route !== "news" && state.route !== "home") go("news");
      else render();
    }
    function bindHero() {
      const track = document.getElementById("heroTrack");
      const dots = document.getElementById("dots");
      if (!track || !dots) return;
      track.onscroll = function () {
        const i = Math.round(track.scrollLeft / Math.max(track.clientWidth * 0.86, 1));
        const n = Math.max(0, Math.min(dots.children.length - 1, i));
        for (var idx = 0; idx < dots.children.length; idx++) {
          dots.children[idx].classList.toggle("on", idx === n);
        }
      };
    }
    async function openNews(id) {
      id = String(id);
      go("article:" + id);
      window.scrollTo(0, 0);
      const post = await loadFull(id);
      if (state.route === "article:" + id) {
        render();
        const box = document.getElementById("fullContent");
        if (box && post) box.innerHTML = post.content || post.excerpt || "متن این مطلب در دسترس نیست.";
      }
    }
    window.go = go;
    window.pickCat = pickCat;
    window.openNews = openNews;
    window.addEventListener("popstate", function (e) {
      state.route = (e.state && e.state.r) ? e.state.r : "home";
      const m = document.getElementById("exitModal");
      if (m) m.remove();
      render();
    });
    window.jfAskExit = function () {
      if (state.route !== "home") {
        try { history.back(); } catch (e) { state.route = "home"; render(); }
        return;
      }
      if (document.getElementById("exitModal")) return;
      const wrap = document.createElement("div");
      wrap.id = "exitModal";
      wrap.className = "modal";
      wrap.innerHTML = '<div class="box"><img src="logo.png" alt="" style="width:88px;height:auto;margin:0 auto 12px;border-radius:12px"/><h3>خروج از برنامه</h3><p>مطمئنید می‌خواهید از جهان فوتبال خارج شوید؟</p><div class="actions"><button class="btn-stay" id="stayBtn">ماندن</button><button class="btn-leave" id="leaveBtn">خروج</button></div></div>';
      document.body.appendChild(wrap);
      document.getElementById("stayBtn").onclick = function () { wrap.remove(); };
      document.getElementById("leaveBtn").onclick = function () { location.href = "app://exit"; };
    };

    document.getElementById("tab").addEventListener("click", function (e) {
      const b = e.target.closest("button");
      if (!b) return;
      e.preventDefault();
      go(b.getAttribute("data-route"));
      window.scrollTo(0, 0);
    });
    document.getElementById("app").addEventListener("click", function (e) {
      const news = e.target.closest("[data-open]");
      if (news) { openNews(news.getAttribute("data-open")); return; }
      const cat = e.target.closest("[data-cat]");
      if (cat) { pickCat(cat.getAttribute("data-cat")); }
    });

    setInterval(function () {
      const track = document.getElementById("heroTrack");
      if (!track || state.route !== "home" || !track.children.length) return;
      const w = track.children[0].getBoundingClientRect().width + 12;
      const max = track.scrollWidth - track.clientWidth;
      const next = track.scrollLeft + w;
      track.scrollTo({ left: next > max - 8 ? 0 : next, behavior: "smooth" });
    }, 5500);

    boot();
    setTimeout(function () {
      const s = document.getElementById("splash");
      if (s) { s.classList.add("hide"); s.style.pointerEvents = "none"; }
    }, 700);
  </script>
</body>
</html>
