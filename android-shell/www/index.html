<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>جهان فوتبال</title>
  <style>
    :root {
      --bg: #f2f3f5;
      --header: #111111;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --line: #e6e7eb;
      --accent: #c8102e;
      --accent-soft: #fde8eb;
      --navy: #151922;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: Tahoma, "IRANSans", "Noto Naskh Arabic", sans-serif; }
    body { min-height: 100vh; }
    img { max-width: 100%; display: block; object-fit: cover; }
    button, input { font-family: inherit; }
    a { color: inherit; text-decoration: none; }
    #app { max-width: 720px; margin: 0 auto; min-height: 100vh; padding-bottom: 86px; }
    .splash {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #111; transition: opacity .35s;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .splash img { width: 168px; height: 168px; object-fit: contain; background: #fff; border-radius: 28px; padding: 10px; }
    .splash h1 { color: #fff; margin: 18px 0 6px; font-size: 22px; }
    .splash p { color: #bdbdbd; margin: 0; }
    header.appbar {
      position: sticky; top: 0; z-index: 12; background: #111;
      padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    }
    header.appbar img.brand { height: 36px; width: auto; object-fit: contain; background: #fff; border-radius: 8px; padding: 3px 8px; }
    header.appbar .grow { flex: 1; }
    header.appbar h1 { color: #fff; font-size: 16px; margin: 0; }
    .icon-btn { background: #2a2a2a; border: 0; color: #fff; width: 38px; height: 38px; border-radius: 10px; }
    .hero-wrap { padding: 12px 12px 0; }
    .hero {
      position: relative; border-radius: 16px; overflow: hidden; height: 220px; background: #ddd;
    }
    .hero img { width: 100%; height: 100%; }
    .hero .cap {
      position: absolute; inset: auto 0 0 0; padding: 16px;
      background: linear-gradient(transparent, rgba(0,0,0,.82));
      color: #fff;
    }
    .chip {
      display: inline-block; background: var(--accent); color: #fff;
      border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: 700;
    }
    .hero h3 { margin: 8px 0 0; font-size: 17px; line-height: 1.45; }
    .dots { display: flex; justify-content: center; gap: 5px; padding: 8px 0 0; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: #c5c5c5; display: block; }
    .dots i.on { background: var(--accent); width: 16px; border-radius: 8px; }
    .section { padding: 6px 12px 0; }
    .section h2 {
      font-size: 15px; margin: 14px 0 10px; display: flex; align-items: center; gap: 8px;
    }
    .section h2:before { content: ""; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; }
    .news {
      display: flex; background: var(--card); border-radius: 12px; overflow: hidden;
      margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .news img { width: 118px; height: 96px; background: #eee; flex-shrink: 0; }
    .news .body { padding: 9px 11px; min-width: 0; }
    .news .cat { color: var(--accent); font-size: 11px; font-weight: 800; }
    .news h3 { margin: 5px 0 7px; font-size: 13.5px; line-height: 1.55; font-weight: 700; }
    .news time { color: var(--muted); font-size: 11px; }
    .cats { display: flex; gap: 8px; overflow: auto; padding: 4px 12px 8px; }
    .cats button {
      background: #fff; color: var(--text); border: 1px solid var(--line);
      border-radius: 20px; padding: 7px 13px; white-space: nowrap; font-size: 12px;
    }
    .cats button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    nav.tabbar {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 720px; margin: 0 auto;
      background: #fff; display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 7px 2px calc(7px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }
    nav.tabbar button { background: none; border: 0; color: #8a8f98; font-size: 11px; padding: 3px 0; }
    nav.tabbar button.active { color: var(--accent); font-weight: 800; }
    nav.tabbar span { display: block; font-size: 17px; margin-bottom: 1px; }
    .searchbox {
      margin: 10px 12px 8px; display: flex; background: #fff; border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px;
    }
    .searchbox input { flex: 1; background: none; border: 0; color: var(--text); outline: none; font-size: 14px; }
    .article .cover { width: 100%; height: 230px; background: #ddd; }
    .article .pad { padding: 16px 16px 36px; background: #fff; }
    .article h2 { font-size: 21px; line-height: 1.5; margin: 8px 0 10px; }
    .article .content { line-height: 2; font-size: 15.5px; color: #222; }
    .article .content img { border-radius: 10px; margin: 10px 0; }
    .article .content p { margin: 0 0 12px; }
    .empty { text-align: center; color: var(--muted); padding: 48px 24px; line-height: 1.8; }
    .info { background: #fff; margin: 12px; padding: 16px; border-radius: 12px; color: var(--muted); line-height: 1.8; }
    .banner-logo { display: block; height: 42px; margin: 0 auto; object-fit: contain; }
    .status { text-align: center; color: var(--muted); font-size: 12px; padding: 6px; }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <img id="splashLogo" alt="جهان فوتبال" src="https://jahanefootball.com/wp-content/uploads/2026/08/cropped-%D9%84%D9%88%DA%AF%D9%88-%DA%A9%D9%88%DA%86%DA%A9-%DA%86%D9%87%D8%A7%D9%86-%D9%81%D9%88%D8%AA%D8%A8%D8%A7%D9%84.jpg" />
    <h1>جهان فوتبال</h1>
    <p>جدیدترین اخبار دنیای فوتبال</p>
  </div>
  <div id="app"></div>
  <nav class="tabbar" id="tabbar">
    <button data-route="home" class="active"><span>🏠</span>خانه</button>
    <button data-route="news"><span>📰</span>اخبار</button>
    <button data-route="search"><span>🔍</span>جستجو</button>
    <button data-route="football"><span>⚽</span>مسابقات</button>
    <button data-route="more"><span>☰</span>بیشتر</button>
  </nav>
  <script>
    const WP = "https://jahanefootball.com";
    const LOGO = WP + "/wp-content/uploads/2026/08/cropped-%D9%84%D9%88%DA%AF%D9%88-%DA%A9%D9%88%DA%86%DA%A9-%DA%86%D9%87%D8%A7%D9%86-%D9%81%D9%88%D8%AA%D8%A8%D8%A7%D9%84.jpg";
    const LOGO_WIDE = WP + "/wp-content/uploads/2026/07/%D9%85%D8%AE%D9%84%D8%AE-%D8%B3%D8%AB%D8%A8%D9%87%DB%8C.png";
    const state = {
      route: "home",
      category: "all",
      query: "",
      news: [],
      categories: [{ id: "all", name: "همه" }],
      heroIndex: 0,
      loading: true,
      error: ""
    };

    function strip(html) {
      const d = document.createElement("div");
      d.innerHTML = html || "";
      return (d.textContent || d.innerText || "").replace(/\s+/g, " ").trim();
    }
    function decode(html) {
      const d = document.createElement("textarea");
      d.innerHTML = html || "";
      return d.value;
    }
    function featuredImage(post) {
      try {
        return post._embedded["wp:featuredmedia"][0].source_url || "";
      } catch (e) { return ""; }
    }
    function catName(post) {
      try {
        const terms = post._embedded["wp:term"] || [];
        for (const group of terms) {
          for (const t of group) {
            if (t.taxonomy === "category") return t.name;
          }
        }
      } catch (e) {}
      return "اخبار";
    }
    function mapPost(post) {
      return {
        id: String(post.id),
        title: decode(strip(post.title && post.title.rendered)),
        excerpt: decode(strip(post.excerpt && post.excerpt.rendered)),
        content: (post.content && post.content.rendered) || "",
        image: featuredImage(post),
        category: catName(post),
        category_id: (post.categories && post.categories[0]) ? String(post.categories[0]) : "all",
        date: post.date,
        link: post.link
      };
    }
    function faDate(iso) {
      if (!iso) return "";
      try { return new Date(iso).toLocaleDateString("fa-IR", { year: "numeric", month: "long", day: "numeric" }); }
      catch (e) { return iso; }
    }

    async function wpGet(path) {
      const res = await fetch(WP + path, { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    async function loadHome() {
      state.loading = true;
      try {
        const [posts, cats] = await Promise.all([
          wpGet("/wp-json/wp/v2/posts?per_page=20&_embed=1"),
          wpGet("/wp-json/wp/v2/categories?per_page=40&hide_empty=true")
        ]);
        state.news = (posts || []).map(mapPost);
        state.categories = [{ id: "all", name: "همه" }].concat(
          (cats || []).filter(c => c.slug !== "uncategorized").map(c => ({ id: String(c.id), name: c.name }))
        );
        state.error = state.news.length ? "" : "خبری از سایت دریافت نشد.";
      } catch (e) {
        state.error = "اتصال به سایت برقرار نشد. اینترنت را بررسی کنید.";
      }
      state.loading = false;
      render();
    }

    async function loadCategory(id) {
      state.loading = true; render();
      try {
        const q = id === "all" ? "" : ("&categories=" + encodeURIComponent(id));
        const posts = await wpGet("/wp-json/wp/v2/posts?per_page=20&_embed=1" + q);
        state.news = (posts || []).map(mapPost);
      } catch (e) {
        state.error = "بارگذاری دسته ممکن نشد.";
      }
      state.loading = false;
      render();
    }

    async function searchWp(q) {
      if (!q) { loadHome(); return; }
      try {
        const posts = await wpGet("/wp-json/wp/v2/posts?per_page=20&_embed=1&search=" + encodeURIComponent(q));
        const items = (posts || []).map(mapPost);
        const box = document.getElementById("results");
        if (box) box.innerHTML = items.length ? items.map(newsCard).join("") : '<div class="empty">نتیجه‌ای پیدا نشد.</div>';
      } catch (e) {
        const box = document.getElementById("results");
        if (box) box.innerHTML = '<div class="empty">جستجو انجام نشد.</div>';
      }
    }

    async function openNews(id) {
      state.route = "article:" + id;
      let item = state.news.find(n => n.id === id);
      render();
      window.scrollTo(0, 0);
      if (!item || !item.content) {
        try {
          const post = await wpGet("/wp-json/wp/v2/posts/" + id + "?_embed=1");
          item = mapPost(post);
          const i = state.news.findIndex(n => n.id === id);
          if (i >= 0) state.news[i] = item; else state.news.unshift(item);
          if (state.route === "article:" + id) render();
        } catch (e) {}
      }
    }

    function newsCard(n) {
      return `<article class="news" onclick="openNews('${n.id}')">
        <img src="${n.image || LOGO}" alt="" onerror="this.src='${LOGO}'" />
        <div class="body"><div class="cat">${n.category || "اخبار"}</div><h3>${n.title}</h3><time>${faDate(n.date)}</time></div>
      </article>`;
    }
    function brandHeader(title) {
      return `<header class="appbar">
        <img class="brand" src="${LOGO}" alt="جهان فوتبال" onerror="this.style.display='none'" />
        <div class="grow"><h1>${title}</h1></div>
      </header>`;
    }

    function render() {
      const app = document.getElementById("app");
      const news = state.news;
      const featured = news.slice(0, 4);
      const hero = featured[state.heroIndex] || featured[0];
      const filtered = state.category === "all" ? news : news.filter(n => n.category_id === state.category);

      if (state.route === "home") {
        app.innerHTML = `
          ${brandHeader("جهان فوتبال")}
          ${state.loading ? '<div class="status">در حال دریافت اخبار سایت…</div>' : ""}
          ${state.error ? '<div class="status">' + state.error + "</div>" : ""}
          ${hero ? `<div class="hero-wrap"><div class="hero" onclick="openNews('${hero.id}')">
              <img src="${hero.image || LOGO}" onerror="this.src='${LOGO}'" />
              <div class="cap"><span class="chip">${hero.category}</span><h3>${hero.title}</h3></div>
            </div>
            <div class="dots">${featured.map((_,i)=>`<i class="${i===state.heroIndex?'on':''}"></i>`).join("")}</div></div>` : ""}
          <div class="cats">${state.categories.map(c => `<button class="${c.id===state.category?'on':''}" onclick="pickCat('${c.id}')">${c.name}</button>`).join("")}</div>
          <div class="section"><h2>آخرین اخبار</h2>${filtered.map(newsCard).join("") || '<div class="empty">خبری نیست.</div>'}</div>`;
      } else if (state.route === "news") {
        app.innerHTML = `${brandHeader("اخبار")}
          <div class="cats">${state.categories.map(c => `<button class="${c.id===state.category?'on':''}" onclick="pickCat('${c.id}')">${c.name}</button>`).join("")}</div>
          <div class="section">${filtered.map(newsCard).join("") || '<div class="empty">خبری در این دسته نیست.</div>'}</div>`;
      } else if (state.route === "search") {
        app.innerHTML = `${brandHeader("جستجو")}
          <div class="searchbox"><input id="q" placeholder="جستجو در اخبار جهان فوتبال…" value="${state.query}" /></div>
          <div class="section" id="results">${news.map(newsCard).join("")}</div>`;
        const input = document.getElementById("q");
        if (input) {
          input.addEventListener("input", () => {
            state.query = input.value;
            clearTimeout(window._st);
            window._st = setTimeout(() => searchWp(state.query.trim()), 350);
          });
        }
      } else if (state.route === "football") {
        app.innerHTML = `${brandHeader("مسابقات")}
          <div class="info">نتایج زنده از افزونه اختصاصی سایت در مرحله بعد وصل می‌شود.<br><br>
          فعلاً جدول رقابت‌ها را در سایت ببینید.</div>
          <div class="section"><a class="news" href="https://jahanefootball.com/%d8%ac%d8%af%d9%88%d9%84-%d9%84%db%8c%da%af-%d8%b1%d9%82%d8%a7%d8%a8%d8%aa-%d9%87%d8%a7/" onclick="location.href=this.href;return false;">
            <div class="body"><div class="cat">سایت</div><h3>مشاهده جدول رقابت‌ها</h3><time>jahanefootball.com</time></div>
          </a></div>`;
      } else if (state.route === "more") {
        app.innerHTML = `${brandHeader("بیشتر")}
          <div class="info" style="text-align:center">
            <img class="banner-logo" src="${LOGO}" alt="جهان فوتبال" />
            <p style="color:var(--text);font-weight:800;margin:12px 0 4px">جهان فوتبال</p>
            جدیدترین اخبار دنیای فوتبال<br>
            منبع: jahanefootball.com<br>
            نسخه ۱.۰.۱
          </div>`;
      } else if (state.route.startsWith("article:")) {
        const n = news.find(x => x.id === state.route.slice(8)) || news[0] || { title: "", content: "", image: "", category: "", date: "" };
        app.innerHTML = `<article class="article">
          <header class="appbar"><button class="icon-btn" onclick="state.route='home';render()">➜</button>
            <div class="grow"><h1>خبر</h1></div></header>
          <img class="cover" src="${n.image || LOGO}" onerror="this.src='${LOGO}'" />
          <div class="pad"><span class="chip">${n.category || "اخبار"}</span>
            <h2>${n.title || ""}</h2>
            <div style="color:#888;font-size:12px;margin-bottom:12px">${faDate(n.date)}</div>
            <div class="content">${n.content || n.excerpt || ""}</div>
          </div></article>`;
      }
      document.querySelectorAll("#tabbar button").forEach(b => {
        b.classList.toggle("active", b.dataset.route === state.route || (state.route.startsWith("article") && b.dataset.route === "news"));
      });
    }

    function pickCat(id) {
      state.category = id;
      if (state.route === "home" || state.route === "news") loadCategory(id);
      else render();
    }

    document.getElementById("tabbar").addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      state.route = btn.dataset.route;
      render();
      window.scrollTo(0, 0);
    });

    setInterval(() => {
      if (state.route !== "home" || state.news.length < 2) return;
      state.heroIndex = (state.heroIndex + 1) % Math.min(4, state.news.length);
      render();
    }, 5000);

    loadHome();
    setTimeout(() => document.getElementById("splash").classList.add("hide"), 1200);
  </script>
</body>
</html>
