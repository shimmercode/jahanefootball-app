name: jahan_football
description: جهان فوتبال — اخبار فوتبال ایران و جهان، نتایج زنده و مرکز مسابقات.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: any
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  timeago: ^3.7.0
  connectivity_plus: ^6.1.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon_1024.png
  adaptive_icon_background: "#071912"
  adaptive_icon_foreground: assets/branding/adaptive_fg.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#071912"
  image: assets/branding/app_icon_1024.png
  android_12:
    color: "#071912"
    image: assets/branding/app_icon_1024.png
  android: true
  ios: false
