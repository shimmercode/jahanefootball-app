name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Create Android platform
        working-directory: mobile
        run: flutter create --platforms=android --org ir.jahanfootball --project-name jahan_football .
      - name: Production Android config
        run: python3 scripts/configure_android.py
      - name: Icons and splash
        working-directory: mobile
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create || true
      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=ENV=production \
            --dart-define=API_BASE_URL=https://raw.githubusercontent.com/shimmercode/jahanefootball-app/v1.0.0/backend/public/v1 \
            --dart-define=FOOTBALL_API_BASE_URL=https://www.thesportsdb.com/api/v1/json/3
      - name: Build release AAB
        working-directory: mobile
        run: |
          flutter build appbundle --release \
            --dart-define=ENV=production \
            --dart-define=API_BASE_URL=https://raw.githubusercontent.com/shimmercode/jahanefootball-app/v1.0.0/backend/public/v1 \
            --dart-define=FOOTBALL_API_BASE_URL=https://www.thesportsdb.com/api/v1/json/3
      - name: Stage and validate
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p artifacts
          cp mobile/build/app/outputs/flutter-apk/app-release.apk artifacts/jahan-football-v1.0.0-release.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk artifacts/JahanFootball.apk
          cp mobile/build/app/outputs/bundle/release/app-release.aab artifacts/jahan-football-v1.0.0-release.aab
          python3 scripts/validate_apk.py artifacts/jahan-football-v1.0.0-release.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Jahan Football ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          files: |
            artifacts/jahan-football-v1.0.0-release.apk
            artifacts/JahanFootball.apk
            artifacts/jahan-football-v1.0.0-release.aab
          body: |
            # جهان فوتبال ${{ env.RELEASE_TAG }}

            **Release date:** 2026-08-15

            ## Install
            Download `jahan-football-v1.0.0-release.apk` (or `JahanFootball.apk`) and install on Android 6.0+.

            Package: `ir.jahanfootball.app`

            ## New features
            - Persian RTL home, news, search and football center
            - Production API + offline catalog fallback
            - Live / scheduled / finished match tabs
            - In-app notification center

            ## Known issues
            - Firebase Cloud Messaging is not wired (credentials not provided)
            - Dedicated production WordPress host is not connected yet
            - TheSportsDB free tier is used for extra football data

            ## Requirements
            - Minimum Android: 6.0 (API 23)
            - API version: v1
