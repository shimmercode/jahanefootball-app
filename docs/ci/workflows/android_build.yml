name: Android Build

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "mobile/**"
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/android_build.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Build debug and release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Create Android platform
        working-directory: mobile
        run: flutter create --platforms=android --org ir.jahanfootball --project-name jahan_football .
      - name: Production Android config
        run: python3 scripts/configure_android.py
      - name: Icons and splash
        working-directory: mobile
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create || true
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=ENV=development
      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=ENV=production \
            --dart-define=API_BASE_URL=https://raw.githubusercontent.com/shimmercode/jahanefootball-app/v1.0.0/backend/public/v1 \
            --dart-define=FOOTBALL_API_BASE_URL=https://www.thesportsdb.com/api/v1/json/3
      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk artifacts/app-debug.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk artifacts/jahan-football-v1.0.0-release.apk
          python3 scripts/validate_apk.py artifacts/jahan-football-v1.0.0-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jahan-football-apk
          path: artifacts/*.apk
          if-no-files-found: error
